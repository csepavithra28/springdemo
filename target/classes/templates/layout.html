<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Student Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <!-- BRAND -->
        <a class="navbar-brand"
           th:href="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? @{/admin/dashboard} : @{/user/dashboard}">
            StudentMini
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">


                <!-- ======================= ADMIN MENU ======================= -->
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/students}">Manage Students</a>
                </li>

                <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/courses}">Manage Courses</a>
                </li>

                <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Admin Dashboard</a>
                </li>


                <!-- ======================= USER MENU ======================= -->
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_USER')">
                    <a class="nav-link" th:href="@{/courses}">Courses</a>
                </li>

                <li class="nav-item" sec:authorize="hasAuthority('ROLE_USER')">
                    <a class="nav-link" th:href="@{/user/dashboard}">User Dashboard</a>
                </li>


                <!-- ======================= COMMON (LOGGED IN) ======================= -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:text="${#authentication.name}"></a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>


                <!-- ======================= GUEST ONLY ======================= -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>

            </ul>
        </div>
    </div>
</nav>


<div class="container mt-4">
    <div th:replace="${content} :: content"></div>
</div>

<footer class="bg-dark text-white text-center p-2 mt-5">
    Student Management Mini Project © 2025
</footer>

</body>
</html>
