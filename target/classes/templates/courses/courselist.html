<div th:fragment="content">
    <h2>Courses</h2>
    <a href="/courses/add" class="btn btn-primary mb-2">Add Course</a>
    <table class="table">
        <tr><th>ID</th><th>Name</th></tr>
        <tr th:each="c : ${courses}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.courseName}"></td>
        </tr>
    </table>
</div>
