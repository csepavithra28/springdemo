<div th:fragment="content">
    <h2>Add Course</h2>
    <form th:action="@{/courses/save}" th:object="${course}" method="post">
        <input class="form-control mb-2" th:field="*{courseName}" placeholder="Course name" required />
        <button class="btn btn-success">Save</button>
        <a class="btn btn-secondary" href="/courses">Cancel</a>
    </form>
</div>
