<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container">
<div class="row justify-content-center">
    <div class="col-md-4">
        <h3 class="mt-5">Login</h3>

        <form th:action="@{/login}" method="post">

            <!-- USERNAME -->
            <div class="mb-2">
                <input name="username" class="form-control" placeholder="Username" required/>
            </div>

            <!-- PASSWORD -->
            <div class="mb-2">
                <input name="password" type="password" class="form-control" placeholder="Password" required/>
            </div>

            <!-- NO ROLE DROPDOWN HERE -->

            <button class="btn btn-primary w-100">Login</button>
        </form>

        <p class="mt-3">No account? <a th:href="@{/register}">Register</a></p>
        <p th:if="${param.error}" class="text-danger">Invalid credentials</p>
        <p th:if="${param.logout}" class="text-success">You have been logged out</p>
    </div>
</div>
</body>
</html>
