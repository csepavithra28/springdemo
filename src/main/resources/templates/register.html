<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container">

<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mt-4">Register</h3>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="mb-3">
                <input th:field="*{username}" class="form-control" placeholder="Username" required/>
            </div>

            <div class="mb-3">
                <input th:field="*{password}" type="password" class="form-control" placeholder="Password" required/>
            </div>

            <!-- ROLE SELECTION -->
            <div class="mb-3">
                <select th:field="*{role}" class="form-control">
                    <option value="ROLE_USER">User</option>
                    <option value="ROLE_ADMIN">Admin</option>
                </select>
            </div>

            <button class="btn btn-primary w-100">Register</button>
        </form>

        <p th:if="${error}" class="text-danger mt-2" th:text="${error}"></p>
    </div>
</div>

</body>
</html>
